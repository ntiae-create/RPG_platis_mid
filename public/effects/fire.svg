<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" preserveAspectRatio="none">
  <defs>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff2400"/>
      <stop offset=".45" stop-color="#ff7a00"/>
      <stop offset=".8" stop-color="#ffd34d"/>
      <stop offset="1" stop-color="#fff4b0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <g opacity=".45" filter="url(#glow)" fill="#ff4b00">
    <path d="M20 120 C5 95 35 78 28 55 C55 72 58 92 50 120Z"/>
    <path d="M70 120 C48 88 83 76 78 42 C108 67 110 94 98 120Z"/>
    <path d="M130 120 C105 88 142 70 137 35 C170 64 170 95 158 120Z"/>
    <path d="M195 120 C172 88 207 75 204 45 C234 68 238 95 225 120Z"/>
    <path d="M255 120 C235 90 270 78 265 48 C292 72 298 96 286 120Z"/>
  </g>

  <g fill="url(#fire)">
    <path d="M18 120 C3 96 34 78 27 53 C54 70 57 92 48 120Z"/>
    <path d="M69 120 C47 89 82 76 77 40 C107 66 109 94 97 120Z"/>
    <path d="M130 120 C104 88 141 70 136 32 C169 62 170 94 157 120Z"/>
    <path d="M194 120 C171 88 206 74 203 42 C233 66 237 94 224 120Z"/>
    <path d="M254 120 C234 90 269 77 264 45 C291 69 297 95 285 120Z"/>
  </g>

  <g fill="#fff4b0">
    <circle cx="43" cy="48" r="1.5"/>
    <circle cx="91" cy="35" r="1.2"/>
    <circle cx="151" cy="27" r="1.7"/>
    <circle cx="217" cy="38" r="1.3"/>
    <circle cx="278" cy="34" r="1.5"/>
  </g>
<style>
.fire-glow{transform-origin:center bottom;animation:fireGlow 1.8s ease-in-out infinite}
.fire-flame{transform-origin:center bottom;animation:fireFlame 1.15s ease-in-out infinite alternate}
.fire-flame:nth-of-type(2){animation-delay:-.35s}
.fire-flame:nth-of-type(3){animation-delay:-.7s}
.fire-flame:nth-of-type(4){animation-delay:-.2s}
.fire-flame:nth-of-type(5){animation-delay:-.55s}
@keyframes fireGlow{
0%,100%{transform:scaleY(.92);opacity:.32}
50%{transform:scaleY(1.08);opacity:.58}
}
@keyframes fireFlame{
0%{transform:translateY(3px) scale(.94,.9);opacity:.78}
50%{transform:translateY(-4px) scale(1.04,1.08);opacity:1}
100%{transform:translateY(-8px) scale(.96,1.14);opacity:.82}
}
</style>
</svg>
